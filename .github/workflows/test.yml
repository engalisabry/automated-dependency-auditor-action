name: Test Dependency Auditor with DeepWiki

on: [push]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node.js dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install DeepWiki Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deepwiki/api/requirements.txt

      - name: Run Dependency Auditor with DeepWiki
        uses: ./
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

